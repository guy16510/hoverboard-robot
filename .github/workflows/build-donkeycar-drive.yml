name: Build Donkeycar driveway MVP

on:
  push:
    branches:
      - goal/donkeycar-driveway-mvp
      - feature/pi-esp32-wifi-simulated-drive
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Bootstrap pinned build tools
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements-dev.txt
          ./tools/bootstrap-tools.sh

      - name: Validate deployment contract
        run: |
          set -euo pipefail
          bash -n donkeycar/scripts/install-pi.sh
          bash -n donkeycar/scripts/install-service.sh
          bash -n donkeycar/scripts/validate-service-unit.sh
          bash -n raspberry-pi-image/build-image.sh
          bash -n raspberry-pi-image/validate-image.sh
          find raspberry-pi-image/stage-trashcan -type f -name '*.sh' -print0 | \
            xargs -0 -n1 bash -n
          bash donkeycar/scripts/validate-service-unit.sh \
            donkeycar/systemd/trashcan-donkeycar.service \
            trashbot trashbot /opt/trashcan-robot/donkeycar

      - name: Test Pi integration boundary
        run: |
          set -euo pipefail
          .venv/bin/pip install --disable-pip-version-check -r donkeycar/requirements-test.txt
          PYTHONPATH=donkeycar .venv/bin/python -m pytest -q donkeycar/tests

      - name: Build production ESP32 drive coordinator
        run: |
          set -euo pipefail
          export PLATFORMIO_CORE_DIR="$PWD/.platformio"
          export PLATFORMIO_SETTING_ENABLE_TELEMETRY=no
          if ! .venv/bin/pio run -c platformio-drive.ini -e esp32_drive_coordinator > esp32-drive-build.log 2>&1; then
            tail -250 esp32-drive-build.log
            exit 1
          fi
          tail -80 esp32-drive-build.log

      - name: Upload production ESP32 firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: esp32-drive-coordinator-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .pio/build/esp32_drive_coordinator/firmware.bin
            .pio/build/esp32_drive_coordinator/firmware.elf
            .pio/build/esp32_drive_coordinator/firmware.map
            .pio/build/esp32_drive_coordinator/bootloader.bin
            .pio/build/esp32_drive_coordinator/partitions.bin
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: esp32-drive-build-log-${{ github.event.pull_request.head.sha || github.sha }}
          path: esp32-drive-build.log
          if-no-files-found: ignore
          retention-days: 30
