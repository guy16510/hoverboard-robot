name: Build Raspberry Pi image

on:
  push:
    branches:
      - goal/donkeycar-driveway-mvp
      - feature/pi-esp32-wifi-simulated-drive
    paths:
      - 'raspberry-pi-image/**'
      - 'donkeycar/**'
      - '.github/workflows/build-raspberry-pi-image.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'raspberry-pi-image/**'
      - 'donkeycar/**'
      - '.github/workflows/build-raspberry-pi-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raspberry-pi-image-${{ github.ref }}
  cancel-in-progress: true

env:
  TRASHCAN_WIFI_SSID: ${{ secrets.TRASHCAN_WIFI_SSID }}
  TRASHCAN_WIFI_PASSWORD: ${{ secrets.TRASHCAN_WIFI_PASSWORD }}

jobs:
  build-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Reclaim runner disk
        run: |
          set -euo pipefail
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet || true
          sudo apt-get clean
          df -h

      - name: Install pi-gen dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip \
            dosfstools e2fsprogs libarchive-tools libcap2-bin grep rsync xz-utils \
            file git curl bc gpg pigz xxd arch-test bmap-tools kmod

      - name: Validate image source contract
        run: |
          set -euo pipefail
          bash donkeycar/scripts/validate-service-unit.sh \
            donkeycar/systemd/trashcan-donkeycar.service \
            trashbot trashbot /opt/trashcan-robot/donkeycar
          grep -Fxq 'nodejs' raspberry-pi-image/stage-trashcan/00-install/00-packages
          grep -Fxq 'npm' raspberry-pi-image/stage-trashcan/00-install/00-packages
          grep -Fxq 'python3-opencv' raspberry-pi-image/stage-trashcan/00-install/00-packages
          grep -Fxq 'v4l-utils' raspberry-pi-image/stage-trashcan/00-install/00-packages
          bash -n raspberry-pi-image/build-image.sh
          bash -n raspberry-pi-image/stage-trashcan/00-install/00-run-chroot.sh
          bash -n raspberry-pi-image/stage-trashcan/00-install/01-verify-marker.sh
          bash -n raspberry-pi-image/validate-image.sh

      - name: Build Bookworm ARM64 robot image
        run: |
          set -euo pipefail
          bash raspberry-pi-image/build-image.sh 2>&1 | tee raspberry-pi-image-build.log

      - name: Verify exported image and boot invariants
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/raspberry-pi-image/dist"
          test -s "$dist/SHA256SUMS"
          test -s "$dist/IMAGE_SOURCE.txt"

          for fact in \
            'architecture=arm64' \
            'release=bookworm' \
            'first_boot_user_rename=disabled' \
            'ssh=enabled' \
            'nodejs=installed' \
            'nodejs_minimum_major=18' \
            'npm=installed' \
            'node_protocol_tests=passed' \
            'robot_user=trashbot' \
            'robot_group=trashbot' \
            'robot_working_directory=/opt/trashcan-robot/donkeycar' \
            'robot_service_contract=validated'; do
            grep -Fxq "$fact" "$dist/IMAGE_SOURCE.txt"
          done
          grep -Eq '^wifi_provisioned=(yes|no)$' "$dist/IMAGE_SOURCE.txt"
          if [[ -n "${TRASHCAN_WIFI_SSID:-}" || -n "${TRASHCAN_WIFI_PASSWORD:-}" ]]; then
            test -n "${TRASHCAN_WIFI_SSID:-}"
            test -n "${TRASHCAN_WIFI_PASSWORD:-}"
            grep -Fxq 'wifi_provisioned=yes' "$dist/IMAGE_SOURCE.txt"
          fi

          grep -Fq 'TRASHCAN_IMAGE_ARCHITECTURE=arm64' raspberry-pi-image-build.log
          grep -Fq 'TRASHCAN_IMAGE_RELEASE=bookworm' raspberry-pi-image-build.log
          grep -Fq 'TRASHCAN_FIRST_BOOT_USERCONFIG=disabled' raspberry-pi-image-build.log
          grep -Fq 'TRASHCAN_SSH=enabled' raspberry-pi-image-build.log
          grep -Fq 'Raspberry Pi image Node.js protocol smoke test passed' raspberry-pi-image-build.log
          grep -Fq 'Raspberry Pi image Node.js smoke test passed: node v' raspberry-pi-image-build.log
          grep -Fq 'Raspberry Pi image Node protocol tests passed' raspberry-pi-image-build.log
          grep -Fq 'Raspberry Pi image dependency installation passed' raspberry-pi-image-build.log
          grep -Fq 'Trashcan robot service contract validated' raspberry-pi-image-build.log
          grep -Fq 'Raspberry Pi image Python smoke test passed' raspberry-pi-image-build.log
          grep -Fq 'Raspberry Pi image application tests passed' raspberry-pi-image-build.log
          grep -Fq 'Raspberry Pi image systemd verification passed' raspberry-pi-image-build.log
          grep -Fq 'Raspberry Pi image repository ownership validated' raspberry-pi-image-build.log

          mapfile -d '' images < <(find "$dist" -maxdepth 1 -type f -name '*.img.xz' -print0)
          if (( ${#images[@]} != 1 )); then
            echo "Expected exactly one compressed Raspberry Pi image, found ${#images[@]}" >&2
            find "$dist" -maxdepth 1 -type f -printf '%f\n' | sort >&2
            exit 1
          fi

          xz --test "${images[0]}"
          (
            cd "$dist"
            sha256sum --check --strict SHA256SUMS
          )

          # Validate the actual compressed artifact, not only the pi-gen staging
          # rootfs or systemd syntax. The image is uploaded only after this passes.
          sudo bash raspberry-pi-image/validate-image.sh "${images[0]}"

          file "${images[0]}"
          cat "$dist/IMAGE_SOURCE.txt"
          ls -lh "$dist"

      - name: Upload Raspberry Pi image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trashcan-robot-rpi5-image-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            raspberry-pi-image/dist/*
            raspberry-pi-image-build.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trashcan-robot-rpi5-image-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: raspberry-pi-image-build.log
          if-no-files-found: ignore
          retention-days: 30
