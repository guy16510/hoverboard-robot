name: Build SWD motor control

on:
  push:
    branches:
      - codex/swd-esp32-dual-motor-control
      - codex/swd-dual-motor-recovery
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Bootstrap pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements-dev.txt
          ./tools/bootstrap-tools.sh

      - name: Run native tests
        shell: bash
        run: |
          set -euo pipefail
          if ! .venv/bin/pio run -e native_tests > native-build.log 2>&1; then
            tail -250 native-build.log
            exit 1
          fi
          if ! .pio/build/native_tests/program >> native-build.log 2>&1; then
            tail -250 native-build.log
            exit 1
          fi
          tail -30 native-build.log

      - name: Build every firmware environment
        shell: bash
        run: |
          set -euo pipefail
          if ! .venv/bin/pio run > firmware-build.log 2>&1; then
            tail -350 firmware-build.log
            exit 1
          fi
          tail -80 firmware-build.log

      - name: Check firmware size limits
        shell: bash
        run: |
          set -euo pipefail
          size_bin="$HOME/.platformio/packages/toolchain-gccarmnoneeabi/bin/arm-none-eabi-size"
          if [[ ! -x "$size_bin" ]]; then
            size_bin="$PWD/.toolchains/arm-none-eabi/bin/arm-none-eabi-size"
          fi
          test -x "$size_bin"
          for env in gausstop_master gausstop_master_swd gausstop_slave; do
            test -f ".pio/build/${env}/firmware.elf"
            "$size_bin" ".pio/build/${env}/firmware.elf"
          done

      - name: Collect immutable firmware artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p \
            artifacts/gausstop_master_swd \
            artifacts/bench_master_pa4_bypass \
            artifacts/gausstop_slave \
            artifacts/esp32_swd_coordinator

          cp .pio/build/gausstop_master_swd/firmware.bin \
            "artifacts/gausstop_master_swd/gausstop-master-swd-${SOURCE_SHA}.bin"
          cp .pio/build/gausstop_master_swd/firmware.elf \
            "artifacts/gausstop_master_swd/gausstop-master-swd-${SOURCE_SHA}.elf"
          cp .pio/build/gausstop_master_swd/firmware.map \
            "artifacts/gausstop_master_swd/gausstop-master-swd-${SOURCE_SHA}.map"

          cp .pio/build/bench_master_pa4_bypass/firmware.bin \
            "artifacts/bench_master_pa4_bypass/gausstop-master-swd-bench-pa4-bypass-${SOURCE_SHA}.bin"
          cp .pio/build/bench_master_pa4_bypass/firmware.elf \
            "artifacts/bench_master_pa4_bypass/gausstop-master-swd-bench-pa4-bypass-${SOURCE_SHA}.elf"
          cp .pio/build/bench_master_pa4_bypass/firmware.map \
            "artifacts/bench_master_pa4_bypass/gausstop-master-swd-bench-pa4-bypass-${SOURCE_SHA}.map"

          cp .pio/build/gausstop_slave/firmware.bin \
            "artifacts/gausstop_slave/gausstop-slave-${SOURCE_SHA}.bin"
          cp .pio/build/gausstop_slave/firmware.elf \
            "artifacts/gausstop_slave/gausstop-slave-${SOURCE_SHA}.elf"
          cp .pio/build/gausstop_slave/firmware.map \
            "artifacts/gausstop_slave/gausstop-slave-${SOURCE_SHA}.map"

          cp .pio/build/esp32_swd_coordinator/firmware.bin \
            "artifacts/esp32_swd_coordinator/esp32-swd-coordinator-app-${SOURCE_SHA}.bin"
          cp .pio/build/esp32_swd_coordinator/firmware.elf \
            "artifacts/esp32_swd_coordinator/esp32-swd-coordinator-${SOURCE_SHA}.elf"
          cp .pio/build/esp32_swd_coordinator/firmware.map \
            "artifacts/esp32_swd_coordinator/esp32-swd-coordinator-${SOURCE_SHA}.map"
          cp .pio/build/esp32_swd_coordinator/bootloader.bin \
            "artifacts/esp32_swd_coordinator/esp32-swd-coordinator-bootloader-${SOURCE_SHA}.bin"
          cp .pio/build/esp32_swd_coordinator/partitions.bin \
            "artifacts/esp32_swd_coordinator/esp32-swd-coordinator-partitions-${SOURCE_SHA}.bin"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('artifacts')
          files = sorted(path for path in root.rglob('*') if path.is_file())
          manifest = {
              'source_commit': os.environ['SOURCE_SHA'],
              'protocol_version': 2,
              'toolchain': {'platformio': '6.1.19', 'python': '3.12'},
              'profiles': {
                  'gausstop_master_swd': {
                      'environment': 'gausstop_master_swd',
                      'pa4_bypass': False,
                  },
                  'bench_master_pa4_bypass': {
                      'environment': 'bench_master_pa4_bypass',
                      'pa4_bypass': True,
                      'operational_release_allowed': False,
                  },
                  'gausstop_slave': {
                      'environment': 'gausstop_slave',
                      'pa4_bypass': False,
                  },
                  'esp32_swd_coordinator': {
                      'environment': 'esp32_swd_coordinator',
                  },
              },
              'files': {},
          }
          for path in files:
              manifest['files'][str(path.relative_to(root))] = {
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'bytes': path.stat().st_size,
              }
          (root / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          (
            cd artifacts
            sha256sum $(find . -type f ! -name manifest.json | sort) > sha256.txt
          )

      - name: Verify clean-build reproducibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/first-build
          cp .pio/build/gausstop_master_swd/firmware.bin /tmp/first-build/master.bin
          cp .pio/build/gausstop_slave/firmware.bin /tmp/first-build/slave.bin
          cp .pio/build/esp32_swd_coordinator/firmware.bin /tmp/first-build/esp32.bin
          .venv/bin/pio run -t clean >/dev/null
          .venv/bin/pio run -e gausstop_master_swd -e gausstop_slave -e esp32_swd_coordinator > reproducibility-build.log 2>&1
          cmp /tmp/first-build/master.bin .pio/build/gausstop_master_swd/firmware.bin
          cmp /tmp/first-build/slave.bin .pio/build/gausstop_slave/firmware.bin
          cmp /tmp/first-build/esp32.bin .pio/build/esp32_swd_coordinator/firmware.bin

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swd-build-logs-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            native-build.log
            firmware-build.log
            reproducibility-build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swd-motor-control-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30
