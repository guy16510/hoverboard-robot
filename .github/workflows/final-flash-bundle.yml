name: Final three-controller flash bundle

on:
  push:
    branches:
      - feature/pi-esp32-wifi-simulated-drive
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-final-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Bootstrap pinned build and test tools
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements-dev.txt
          .venv/bin/pip install --disable-pip-version-check -r donkeycar/requirements-test.txt
          ./tools/bootstrap-tools.sh

      - name: Run complete hardware-free validation
        run: |
          set -euo pipefail
          export PLATFORMIO_CORE_DIR="$PWD/.platformio"
          export PLATFORMIO_SETTING_ENABLE_TELEMETRY=no
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=donkeycar \
            .venv/bin/python -m pytest -q donkeycar/tests
          node --test tools/pi-client/test/*.test.mjs
          ./tools/test-native.sh
          ./tools/test-sanitized.sh
          ./tools/test-esp32-balance.sh
          .venv/bin/pio run -e native_tests
          .pio/build/native_tests/program

      - name: Clean-build exact final firmware set
        run: |
          set -euo pipefail
          export PLATFORMIO_CORE_DIR="$PWD/.platformio"
          export PLATFORMIO_SETTING_ENABLE_TELEMETRY=no
          rm -rf \
            .pio/build/gausstop_slave \
            .pio/build/gausstop_master_swd \
            .pio/build/esp32_drive_coordinator
          .venv/bin/pio run -e gausstop_slave
          .venv/bin/pio run -e gausstop_master_swd
          .venv/bin/pio run -c platformio-drive.ini -e esp32_drive_coordinator

      - name: Create immutable flash manifest
        run: |
          set -euo pipefail
          bundle="$PWD/final-flash-bundle"
          rm -rf "$bundle"
          mkdir -p "$bundle/gausstop_slave" "$bundle/gausstop_master_swd" "$bundle/esp32_drive_coordinator"

          cp .pio/build/gausstop_slave/firmware.bin "$bundle/gausstop_slave/"
          cp .pio/build/gausstop_slave/firmware.elf "$bundle/gausstop_slave/"
          cp .pio/build/gausstop_master_swd/firmware.bin "$bundle/gausstop_master_swd/"
          cp .pio/build/gausstop_master_swd/firmware.elf "$bundle/gausstop_master_swd/"
          cp .pio/build/esp32_drive_coordinator/firmware.bin "$bundle/esp32_drive_coordinator/"
          cp .pio/build/esp32_drive_coordinator/firmware.elf "$bundle/esp32_drive_coordinator/"
          cp .pio/build/esp32_drive_coordinator/partitions.bin "$bundle/esp32_drive_coordinator/"
          cp .pio/build/esp32_drive_coordinator/bootloader.bin "$bundle/esp32_drive_coordinator/"

          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "protocol_version=3"
            echo "command_marker=0x32"
            echo "slave_feedback_marker=0x33"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Flash all three directories from this one artifact. Mixed protocol epochs fail closed."
          } > "$bundle/MANIFEST.txt"

          (
            cd "$bundle"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Verify clean-build reproducibility
        run: |
          set -euo pipefail
          export PLATFORMIO_CORE_DIR="$PWD/.platformio"
          export PLATFORMIO_SETTING_ENABLE_TELEMETRY=no
          rm -rf \
            .pio/build/gausstop_slave \
            .pio/build/gausstop_master_swd \
            .pio/build/esp32_drive_coordinator
          .venv/bin/pio run -e gausstop_slave
          .venv/bin/pio run -e gausstop_master_swd
          .venv/bin/pio run -c platformio-drive.ini -e esp32_drive_coordinator

          cmp final-flash-bundle/gausstop_slave/firmware.bin \
              .pio/build/gausstop_slave/firmware.bin
          cmp final-flash-bundle/gausstop_master_swd/firmware.bin \
              .pio/build/gausstop_master_swd/firmware.bin
          cmp final-flash-bundle/esp32_drive_coordinator/firmware.bin \
              .pio/build/esp32_drive_coordinator/firmware.bin

      - name: Upload final flash bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-flash-bundle-${{ github.sha }}
          path: final-flash-bundle
          if-no-files-found: error
          retention-days: 90
