name: Manual drive hardware-free validation

on:
  push:
    branches:
      - feature/pi-esp32-wifi-simulated-drive
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Bootstrap pinned firmware tools
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements-dev.txt
          ./tools/bootstrap-tools.sh

      - name: Validate Python application and simulations
        run: |
          set -euo pipefail
          .venv/bin/pip install --disable-pip-version-check -r donkeycar/requirements-test.txt
          set +e
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=donkeycar \
            .venv/bin/python -m pytest -vv --tb=short donkeycar/tests \
            | tee pytest.log
          pytest_status=${PIPESTATUS[0]}
          set -e
          if (( pytest_status != 0 )); then
            exit "$pytest_status"
          fi
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=donkeycar \
            .venv/bin/python -m compileall -q donkeycar/trashcan_robot donkeycar/manage.py

      - name: Validate Node protocol and client
        run: |
          set -euo pipefail
          node --version
          node --test tools/pi-client/test/*.test.mjs

      - name: Test differential-drive mixer and safety gate
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ifirmware/esp32/control \
            tests/esp32/test_differential_drive.cpp \
            firmware/esp32/control/differential_drive_mixer.cpp \
            -o /tmp/test-differential-drive
          /tmp/test-differential-drive
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ifirmware/esp32/control \
            tests/esp32/test_drive_safety.cpp \
            firmware/esp32/control/drive_safety.cpp \
            -o /tmp/test-drive-safety
          /tmp/test-drive-safety

      - name: Run native firmware tests
        run: |
          set -euo pipefail
          ./tools/test-native.sh
          ./tools/test-sanitized.sh
          ./tools/test-esp32-balance.sh
          export PLATFORMIO_CORE_DIR="$PWD/.platformio"
          export PLATFORMIO_SETTING_ENABLE_TELEMETRY=no
          .venv/bin/pio run -e native_tests
          .pio/build/native_tests/program

      - name: Clean-build exact final firmware set
        run: |
          set -euo pipefail
          export PLATFORMIO_CORE_DIR="$PWD/.platformio"
          export PLATFORMIO_SETTING_ENABLE_TELEMETRY=no
          rm -rf \
            .pio/build/gausstop_slave \
            .pio/build/gausstop_master_swd \
            .pio/build/esp32_drive_coordinator
          .venv/bin/pio run -e gausstop_slave \
            2>&1 | tee gausstop-slave-build.log
          .venv/bin/pio run -e gausstop_master_swd \
            2>&1 | tee gausstop-master-swd-build.log
          .venv/bin/pio run -c platformio-drive.ini -e esp32_drive_coordinator \
            2>&1 | tee esp32-drive-build.log

      - name: Create immutable matched flash bundle
        run: |
          set -euo pipefail
          bundle="$PWD/final-flash-bundle"
          rm -rf "$bundle"
          mkdir -p \
            "$bundle/gausstop_slave" \
            "$bundle/gausstop_master_swd" \
            "$bundle/esp32_drive_coordinator"

          cp .pio/build/gausstop_slave/firmware.bin \
            "$bundle/gausstop_slave/"
          cp .pio/build/gausstop_slave/firmware.elf \
            "$bundle/gausstop_slave/"
          cp .pio/build/gausstop_master_swd/firmware.bin \
            "$bundle/gausstop_master_swd/"
          cp .pio/build/gausstop_master_swd/firmware.elf \
            "$bundle/gausstop_master_swd/"
          cp .pio/build/esp32_drive_coordinator/firmware.bin \
            "$bundle/esp32_drive_coordinator/"
          cp .pio/build/esp32_drive_coordinator/firmware.elf \
            "$bundle/esp32_drive_coordinator/"
          cp .pio/build/esp32_drive_coordinator/partitions.bin \
            "$bundle/esp32_drive_coordinator/"
          cp .pio/build/esp32_drive_coordinator/bootloader.bin \
            "$bundle/esp32_drive_coordinator/"
          cp .platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            "$bundle/esp32_drive_coordinator/"

          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "protocol_version=3"
            echo "command_marker=0x32"
            echo "slave_feedback_marker=0x33"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "These three firmware directories are one indivisible matched set."
            echo "Mixed protocol epochs fail closed and cannot arm."
          } > "$bundle/MANIFEST.txt"

          cat > "$bundle/esp32_drive_coordinator/FLASH_LAYOUT.txt" <<'EOF'
          ESP32 flash offsets for the esp32dev production image:
          0x1000  bootloader.bin
          0x8000  partitions.bin
          0xE000  boot_app0.bin
          0x10000 firmware.bin
          Preserve NVS unless an explicit recovery procedure requires erasing it.
          EOF

          (
            cd "$bundle"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Verify second clean build is byte-identical
        run: |
          set -euo pipefail
          export PLATFORMIO_CORE_DIR="$PWD/.platformio"
          export PLATFORMIO_SETTING_ENABLE_TELEMETRY=no
          rm -rf \
            .pio/build/gausstop_slave \
            .pio/build/gausstop_master_swd \
            .pio/build/esp32_drive_coordinator
          .venv/bin/pio run -e gausstop_slave
          .venv/bin/pio run -e gausstop_master_swd
          .venv/bin/pio run -c platformio-drive.ini -e esp32_drive_coordinator

          cmp final-flash-bundle/gausstop_slave/firmware.bin \
              .pio/build/gausstop_slave/firmware.bin
          cmp final-flash-bundle/gausstop_master_swd/firmware.bin \
              .pio/build/gausstop_master_swd/firmware.bin
          cmp final-flash-bundle/esp32_drive_coordinator/firmware.bin \
              .pio/build/esp32_drive_coordinator/firmware.bin
          cmp final-flash-bundle/esp32_drive_coordinator/bootloader.bin \
              .pio/build/esp32_drive_coordinator/bootloader.bin
          cmp final-flash-bundle/esp32_drive_coordinator/partitions.bin \
              .pio/build/esp32_drive_coordinator/partitions.bin

      - name: Validate Raspberry Pi deployment contract
        run: |
          set -euo pipefail
          bash -n donkeycar/scripts/install-pi.sh
          bash -n donkeycar/scripts/install-service.sh
          bash -n donkeycar/scripts/validate-service-unit.sh
          bash donkeycar/scripts/validate-service-unit.sh \
            donkeycar/systemd/trashcan-donkeycar.service \
            trashbot trashbot /opt/trashcan-robot/donkeycar
          ! grep -R '/dev/cu\.' donkeycar/config donkeycar/systemd donkeycar/trashcan_robot
          ! grep -R -E 'dev-tty|\.device' donkeycar/systemd
          grep -F 'web_host: 0.0.0.0' donkeycar/config/robot.yaml
          grep -F 'web_port: 8887' donkeycar/config/robot.yaml
          grep -F 'host: 0.0.0.0' donkeycar/config/robot.yaml
          grep -F 'port: 8888' donkeycar/config/robot.yaml

      - name: Upload final matched flash bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-flash-bundle-${{ github.sha }}
          path: final-flash-bundle
          if-no-files-found: error
          retention-days: 90

      - name: Upload validation logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-drive-validation-${{ github.sha }}
          path: |
            pytest.log
            gausstop-slave-build.log
            gausstop-master-swd-build.log
            esp32-drive-build.log
          if-no-files-found: ignore
          retention-days: 30
