name: Verify SWD recovery branch

on:
  push:
    branches:
      - codex/swd-dual-motor-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.19

      - name: Run native tests
        run: pio run -e native_tests

      - name: Build the ESP32 and both motor controllers
        run: >-
          pio run
          -e gausstop_master_swd
          -e bench_master_pa4_bypass
          -e gausstop_slave
          -e esp32_swd_coordinator
