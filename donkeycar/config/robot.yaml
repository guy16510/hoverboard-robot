camera:
  type: picamera2
  width: 640
  height: 480
  fps: 20
backup_camera:
  enabled: true
  device: /dev/video0
  width: 640
  height: 480
  fps: 15
  reconnect_seconds: 2.0
  family: 36h11
  horizontal_fov_degrees: 70.0
  # Set this to the measured black-square width for metric range estimates.
  # ID, bearing, position, rotation, and area work without calibration.
  tag_size_m: 0.0
controller:
  web_host: 0.0.0.0
  web_port: 8887
serial:
  port: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
  baud: 115200
  timeout_seconds: 0.05
  reconnect_seconds: 1.0
  lease_ms: 500
  command_hz: 20
logging:
  directory: ./data/logs
  flush_every: 1
  telemetry_hz: 5
data:
  tubs_directory: ./data/tubs
dashboard:
  host: 0.0.0.0
  port: 8888
limits:
  max_linear_velocity: 0.35
  max_angular_velocity: 0.8
  throttle_deadband: 0.03
  steering_deadband: 0.03
model:
  path: ./models/driveway.h5
  name: driveway
runtime:
  mock_transport: false
  stop_inference_on_disconnect: true
