[platformio]
src_dir = .
default_envs = esp32_drive_coordinator

[env:esp32_drive_coordinator]
platform = https://github.com/platformio/platform-espressif32.git#v6.13.0
platform_packages =
  toolchain-xtensa-esp32@symlink://.toolchains/xtensa-esp32
  tool-esptoolpy@symlink://.toolchains/esptoolpy
  framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#2.0.17
board = esp32dev
framework = arduino
build_type = release
extra_scripts = tools/pio_extra.py
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -Ifirmware/esp32/control
  -Ifirmware/gd32/common/protocol
  -Ifirmware/gd32/common/control
  -Ifirmware/gd32/common/motor
  -Ifirmware/gd32/boards/gausstop_dphc_v33
  -Wall
  -Wextra
  -Werror
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
build_src_filter =
  -<*>
  +<firmware/esp32/drive_coordinator/main.cpp>
  +<firmware/esp32/control/command_arbiter.cpp>
  +<firmware/esp32/control/serial_command_source.cpp>
  +<firmware/esp32/control/serial_messages.cpp>
  +<firmware/esp32/control/serial_protocol.cpp>
  +<firmware/esp32/control/differential_drive_mixer.cpp>
  +<firmware/gd32/boards/gausstop_dphc_v33/gausstop_swd_pulse.c>
  +<firmware/gd32/common/protocol/*.c>
