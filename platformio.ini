[platformio]
src_dir = .
default_envs =
  gausstop_master
  gausstop_master_swd
  gausstop_slave
  gausstop_safe_recovery
  gausstop_communication_diagnostic
  esp32_coordinator
  esp32_swd_coordinator
  esp32_passive_probe
  native_tests

[gd32]
platform = https://github.com/CommunityGD32Cores/platform-gd32.git#b80521168db1afc6e59cab59ce0685014e0a8111
platform_packages =
  framework-spl-gd32@https://github.com/hoverboardhavoc/gd32-pio-spl-package.git#8849cb2af35f16431734d9e9c101de648f54f061
board = genericGD32F130C8
framework = spl
board_build.ldscript = firmware/gd32/boards/gausstop_dphc_v33/gausstop_memory.ld
build_type = release
extra_scripts = tools/pio_extra.py
build_flags =
  -DGD32F130=1
  -DTARGET=1
  -D__PIO_DONT_SET_CLOCK_SOURCE__
  -D__SYSTEM_CLOCK_8M_IRC8M=8000000UL
  -DGS_SYSTEM_CLOCK_HZ=8000000UL
  -DGS_FLASH_BYTES=65536UL
  -DGS_RAM_BYTES=8192UL
  -Ifirmware/gd32/common/protocol
  -Ifirmware/gd32/common/control
  -Ifirmware/gd32/common/motor
  -Ifirmware/gd32/common/safety
  -Ifirmware/gd32/common/transport
  -Ifirmware/gd32/common/coordination
  -Ifirmware/gd32/boards/gausstop_dphc_v33
  -std=c11
  -Wall
  -Wextra
  -Werror
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

[env:gausstop_master]
extends = gd32
build_src_filter =
  -<*>
  +<firmware/gd32/master/main.c>
  +<firmware/gd32/boards/gausstop_dphc_v33/gausstop_board.c>
  +<firmware/gd32/common/protocol/*.c>
  +<firmware/gd32/common/control/gs_wheel_mix.c>
  +<firmware/gd32/common/motor/*.c>
  +<firmware/gd32/common/safety/*.c>
  +<firmware/gd32/common/coordination/gs_master.c>
  +<firmware/gd32/common/transport/gs_baremetal_syscalls.c>

[env:gausstop_master_swd]
extends = gd32
build_flags =
  ${gd32.build_flags}
  -DGS_REMOTE_TRANSPORT_SWD=1
  -Wl,--wrap=gs_board_uart_init
  -Wl,--wrap=gs_board_uart_read
  -Wl,--wrap=gs_board_uart_write
build_src_filter =
  -<*>
  +<firmware/gd32/master/main.c>
  +<firmware/gd32/boards/gausstop_dphc_v33/gausstop_board.c>
  +<firmware/gd32/boards/gausstop_dphc_v33/gausstop_swd_transport.c>
  +<firmware/gd32/common/protocol/*.c>
  +<firmware/gd32/common/control/gs_wheel_mix.c>
  +<firmware/gd32/common/motor/*.c>
  +<firmware/gd32/common/safety/*.c>
  +<firmware/gd32/common/coordination/gs_master.c>
  +<firmware/gd32/common/transport/gs_baremetal_syscalls.c>

[env:gausstop_slave]
extends = gd32
build_src_filter =
  -<*>
  +<firmware/gd32/slave/main.c>
  +<firmware/gd32/boards/gausstop_dphc_v33/gausstop_board.c>
  +<firmware/gd32/common/protocol/*.c>
  +<firmware/gd32/common/control/gs_wheel_mix.c>
  +<firmware/gd32/common/motor/*.c>
  +<firmware/gd32/common/safety/*.c>
  +<firmware/gd32/common/coordination/gs_slave.c>
  +<firmware/gd32/common/transport/gs_baremetal_syscalls.c>

[env:gausstop_safe_recovery]
extends = gd32
build_src_filter =
  -<*>
  +<firmware/gd32/safe_recovery/main.c>
  +<firmware/gd32/common/transport/gs_baremetal_syscalls.c>

[env:gausstop_communication_diagnostic]
extends = gd32
build_src_filter =
  -<*>
  +<firmware/gd32/communication_diagnostic/main.c>
  +<firmware/gd32/boards/gausstop_dphc_v33/gausstop_board.c>
  +<firmware/gd32/common/protocol/*.c>
  +<firmware/gd32/common/transport/gs_baremetal_syscalls.c>

[esp32]
platform = https://github.com/platformio/platform-espressif32.git#v6.13.0
platform_packages =
  framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#2.0.17
board = esp32dev
framework = arduino
build_type = release
extra_scripts = tools/pio_extra.py
build_flags =
  -Ifirmware/gd32/common/protocol
  -Ifirmware/gd32/common/control
  -Ifirmware/gd32/common/motor
  -Wall
  -Wextra
  -Werror
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

[env:esp32_coordinator]
extends = esp32
build_src_filter =
  -<*>
  +<firmware/esp32/coordinator/main.cpp>
  +<firmware/gd32/common/protocol/*.c>
  +<firmware/gd32/common/control/gs_console.c>
  +<firmware/gd32/common/control/gs_wheel_mix.c>

[env:esp32_swd_coordinator]
extends = esp32
build_src_filter =
  -<*>
  +<firmware/esp32/swd_coordinator/main.cpp>
  +<firmware/gd32/common/protocol/*.c>
  +<firmware/gd32/common/control/gs_console.c>
  +<firmware/gd32/common/control/gs_wheel_mix.c>

[env:esp32_passive_probe]
extends = esp32
build_src_filter =
  -<*>
  +<firmware/esp32/passive_probe/main.cpp>
  +<firmware/gd32/common/protocol/*.c>

[env:native_tests]
platform = https://github.com/platformio/platform-native.git#v1.2.1
build_type = debug
extra_scripts = tools/pio_extra.py
build_flags =
  -Ifirmware/gd32/common/protocol
  -Ifirmware/gd32/common/control
  -Ifirmware/gd32/common/motor
  -Ifirmware/gd32/common/safety
  -Ifirmware/gd32/common/transport
  -Ifirmware/gd32/common/coordination
  -Itests/native
  -std=c11
  -Wall
  -Wextra
  -Wpedantic
  -Werror
build_src_filter =
  -<*>
  +<tests/native/*.c>
  +<firmware/gd32/common/protocol/*.c>
  +<firmware/gd32/common/control/*.c>
  +<firmware/gd32/common/motor/*.c>
  +<firmware/gd32/common/safety/*.c>
  +<firmware/gd32/common/coordination/*.c>
