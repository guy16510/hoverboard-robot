# GAUSSTOP DPHC-V3.3 / GD32F130C8T6 target definition for OpenOCD 0.12.
# GD32F130 uses the STM32F1-compatible flash/debug driver but has an explicitly
# bounded 64 KiB flash and 8 KiB SRAM on the supported C8 device.

set CHIPNAME gd32f130
set WORKAREASIZE 0x2000
set FLASH_SIZE 0x10000
source [find target/stm32f1x.cfg]
